# TestFlight'a build: GitHub → Actions → "TestFlight" → Run workflow (dal seç).
# 1) Ubuntu: GameCI ile Unity iOS Xcode projesi (TestFlightBuildTool.BuildForCI)
# 2) macOS: xcodebuild archive + App Store Connect API key ile imzalayıp yükler
# 3) Yüklenen build no'yu ProjectSettings'e yazıp aynı dala commit'ler (yerel build çakışmasın)
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  TEAM_ID: 66ZS86R987

jobs:
  unity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      build_number: ${{ steps.number.outputs.value }}
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v4

      - name: Build numarası
        id: number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet pyjwt cryptography
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          n=$(ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" python3 tools/ci_next_build_number.py)
          rm "$RUNNER_TEMP/asc.p8"
          echo "value=$n" >> "$GITHUB_OUTPUT"
          echo "Build $n"

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CI_BUILD_NUMBER: ${{ steps.number.outputs.value }}
        with:
          targetPlatform: iOS
          buildMethod: BlobSurvivor.EditorTools.TestFlightBuildTool.BuildForCI
          versioning: None
          allowDirtyBuild: true

      # upload-artifact çalıştırma izinlerini (script'ler) kaybeder → tar
      - name: Xcode projesini paketle
        run: sudo tar -czf ios.tar.gz -C build iOS

      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode
          path: ios.tar.gz
          retention-days: 1
          compression-level: 0

  upload:
    needs: unity
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      BUILD_NUMBER: ${{ needs.unity.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          tar -xzf ios.tar.gz

      - name: Arşiv
        run: |
          xcodebuild -project iOS/Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            archive | tail -n 200

      - name: TestFlight'a yükle
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist tools/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Build numarasını commit'le
        run: |
          python3 - <<'EOF'
          import os, re
          n = os.environ["BUILD_NUMBER"]
          p = "ProjectSettings/ProjectSettings.asset"
          s = open(p).read()
          s = re.sub(r"(bundleVersion: 0\.1\.)\d+", r"\g<1>" + n, s)
          s = re.sub(r"(buildNumber:\s*\n(?:\s+\w+:.*\n)*?\s+iPhone: )\d+", r"\g<1>" + n, s)
          open(p, "w").write(s)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectSettings/ProjectSettings.asset
          git commit -m "iOS build $BUILD_NUMBER (0.1.$BUILD_NUMBER), GitHub Actions"
          git pull --rebase && git push

      - name: Temizlik
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
